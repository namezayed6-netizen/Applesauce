name: Build CopaToon HyperHLE iOS18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          rustc --version || true
          cargo --version || true

      - name: Install dependencies
        run: |
          brew install cmake ninja boost
          rustup target add aarch64-apple-ios

      - name: Patch Dynarmic for iOS 18 JIT
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "vendor/dynarmic/externals/oaknut/include/"
              "oaknut/code_block.hpp"
          )

          s = path.read_text()

          # ---------------------------------------------------------
          # 1. Replace the physical-iPhone JIT26 / 0xF00D allocation
          #    path with the older debugger + W^X path.
          # ---------------------------------------------------------
          ctor = s.index("explicit CodeBlock(std::size_t size)")

          start_marker = "# if TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR\n"
          end_marker = "# elif TARGET_OS_IPHONE\n"

          start = s.index(start_marker, ctor)
          end = s.index(end_marker, start)

          replacement = """# if TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR
                  // CopaToon test build:
                  // pre-TXM iOS JIT path for iOS 18.x.
                  // StikDebug supplies CS_DEBUGGED; generated code is
                  // switched between RW and RX with mprotect().
                  m_memory = (std::uint32_t*)mmap(
                      nullptr,
                      size,
                      PROT_READ | PROT_EXEC,
                      MAP_ANON | MAP_PRIVATE,
                      -1,
                      0);
                  m_wmemory = m_memory;
          """

          s = s[:start] + replacement + s[end:]

          # ---------------------------------------------------------
          # 2. mmap() returns MAP_FAILED, not nullptr.
          # ---------------------------------------------------------
          old = """#if defined(_WIN32)
                  if (m_memory == nullptr)
          #elif defined(__APPLE__) && TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR
                  if (m_memory == nullptr || m_wmemory == nullptr)
          #else
                  if (m_memory == MAP_FAILED)
          #endif
          """

          new = """#if defined(_WIN32)
                  if (m_memory == nullptr)
          #else
                  if (m_memory == MAP_FAILED)
          #endif
          """

          if old not in s:
              raise SystemExit(
                  "Could not patch mmap failure check. "
                  "Source layout changed."
              )

          s = s.replace(old, new, 1)

          # ---------------------------------------------------------
          # 3. We now have one mapping, not separate RX/RW aliases.
          #    Remove the iPhone dual-map destructor handling.
          # ---------------------------------------------------------
          destructor = s.index("~CodeBlock()")

          d_start_marker = (
              "# if defined(__APPLE__) && TARGET_OS_IPHONE "
              "&& !TARGET_OS_SIMULATOR\n"
          )

          d_start = s.index(d_start_marker, destructor)
          d_end = s.index("# endif\n", d_start) + len("# endif\n")

          s = s[:d_start] + s[d_end:]

          # ---------------------------------------------------------
          # 4. Enable W^X mprotect flips on real iPhones as well as
          #    the simulator.
          # ---------------------------------------------------------
          old_condition = (
              "#elif defined(__APPLE__) && TARGET_OS_IPHONE "
              "&& TARGET_OS_SIMULATOR"
          )
          new_condition = (
              "#elif defined(__APPLE__) && TARGET_OS_IPHONE"
          )

          count = s.count(old_condition)

          if count != 2:
              raise SystemExit(
                  f"Expected 2 protect/unprotect branches, found {count}"
              )

          s = s.replace(old_condition, new_condition)

          # ---------------------------------------------------------
          # 5. Do not fire BRK #0xF00D when the emulator asks to
          #    detach the JIT broker.
          # ---------------------------------------------------------
          detach_start = s.index("    void detach_jit_server()")
          invalidate_start = s.index(
              "    void invalidate(",
              detach_start
          )

          s = (
              s[:detach_start]
              + "    void detach_jit_server() {}\n\n"
              + s[invalidate_start:]
          )

          path.write_text(s)

          print("Successfully patched Dynarmic for iOS 18.x.")
          PY

          echo "----- Checking patch -----"

          if grep -n \
            "detail::prepare_jit_region(nullptr, size)" \
            vendor/dynarmic/externals/oaknut/include/oaknut/code_block.hpp
          then
            echo "ERROR: old JIT26 allocation is still active"
            exit 1
          fi

          grep -n \
            "m_wmemory = m_memory" \
            vendor/dynarmic/externals/oaknut/include/oaknut/code_block.hpp

          echo "iOS 18 patch OK"

      - name: Verify CopaToon calendar support
        shell: bash
        run: |
          echo "Checking HyperHLE Foundation exports..."

          grep -n "_NSJapaneseCalendar" \
            src/frameworks/foundation/ns_calendar.rs

          grep -n "_NSGregorianCalendar" \
            src/frameworks/foundation/ns_calendar.rs

          grep -n "_NSIslamicCalendar" \
            src/frameworks/foundation/ns_calendar.rs

          grep -n "_NSChineseCalendar" \
            src/frameworks/foundation/ns_calendar.rs

          echo "Calendar exports found."

      - name: Build HyperHLE iOS
        shell: bash
        run: |
          export TOUCHHLE_BOOST_ROOT="$(brew --prefix boost)/include"

          sh platform/ios/scripts/build-sdl-shared.sh iphoneos
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package IPA
        shell: bash
        run: |
          sh platform/ios/scripts/package-ipa.sh

          cp \
            dist/Applesauce-iOS-unsigned.ipa \
            dist/CopaToon-HyperHLE-iOS18-Test1.ipa

          shasum -a 256 \
            dist/CopaToon-HyperHLE-iOS18-Test1.ipa \
            > dist/CopaToon-HyperHLE-iOS18-Test1.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CopaToon-HyperHLE-iOS18-Test1
          path: |
            dist/CopaToon-HyperHLE-iOS18-Test1.ipa
            dist/CopaToon-HyperHLE-iOS18-Test1.sha256
          retention-days: 7

      - name: Patch Dynarmic for iOS 18 JIT
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "vendor/dynarmic/externals/oaknut/include/oaknut/code_block.hpp"
          )

          s = path.read_text()

          # Work only inside CodeBlock constructor.
          marker = "explicit CodeBlock(std::size_t size)"
          if marker not in s:
              raise SystemExit("CodeBlock constructor not found")

          before, after = s.split(marker, 1)

          # Replace physical-iPhone JIT26 broker allocation.
          pattern = re.compile(
              r'#\s*if TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR\n'
              r'.*?'
              r'(?=#\s*elif TARGET_OS_IPHONE\n)',
              re.S
          )

          replacement = """#    if TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR
                  // iOS 18.x pre-TXM JIT path.
                  m_memory = (std::uint32_t*)mmap(
                      nullptr,
                      size,
                      PROT_READ | PROT_EXEC,
                      MAP_ANON | MAP_PRIVATE,
                      -1,
                      0);
                  m_wmemory = m_memory;
          """

          after, n = pattern.subn(replacement, after, count=1)

          if n != 1:
              raise SystemExit(
                  f"Could not patch iPhone constructor: matches={n}"
              )

          s = before + marker + after

          # Fix mmap failure check.
          old = """#if defined(_WIN32)
                  if (m_memory == nullptr)
          #elif defined(__APPLE__) && TARGET_OS_IPHONE && !TARGET_OS_SIMULATOR
                  if (m_memory == nullptr || m_wmemory == nullptr)
          #else
                  if (m_memory == MAP_FAILED)
          #endif"""

          new = """#if defined(_WIN32)
                  if (m_memory == nullptr)
          #else
                  if (m_memory == MAP_FAILED)
          #endif"""

          if old not in s:
              raise SystemExit("mmap failure-check block not found")

          s = s.replace(old, new, 1)

          # Remove dual-map destructor logic on physical iPhone.
          destructor_pos = s.index("~CodeBlock()")
          first = s[:destructor_pos]
          rest = s[destructor_pos:]

          rest, n = re.subn(
              r'#\s*if defined\(__APPLE__\) && TARGET_OS_IPHONE '
              r'&& !TARGET_OS_SIMULATOR\n'
              r'.*?'
              r'#\s*endif\n',
              '',
              rest,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  f"Could not patch destructor: matches={n}"
              )

          s = first + rest

          # Enable mprotect RW/RX switching on real iPhones.
          simulator_condition = (
              "#elif defined(__APPLE__) && TARGET_OS_IPHONE "
              "&& TARGET_OS_SIMULATOR"
          )

          count = s.count(simulator_condition)

          if count != 2:
              raise SystemExit(
                  f"Expected 2 protect/unprotect branches, found {count}"
              )

          s = s.replace(
              simulator_condition,
              "#elif defined(__APPLE__) && TARGET_OS_IPHONE"
          )

          # Make broker detach a no-op.
          s, n = re.subn(
              r'    void detach_jit_server\(\)\n'
              r'    \{\n'
              r'.*?'
              r'    \}\n'
              r'(?=    void invalidate)',
              '    void detach_jit_server() {}\\n',
              s,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  f"Could not patch detach_jit_server: matches={n}"
              )

          path.write_text(s)

          print("Dynarmic iOS 18 patch applied successfully.")
          PY

          echo "===== VERIFY PATCH ====="

          grep -n "m_wmemory = m_memory" \
            vendor/dynarmic/externals/oaknut/include/oaknut/code_block.hpp

          if grep -q \
            "detail::prepare_jit_region(nullptr, size)" \
            vendor/dynarmic/externals/oaknut/include/oaknut/code_block.hpp
          then
            echo "ERROR: JIT26 prepare call is still active"
            exit 1
          fi

          echo "JIT26 prepare call removed."
          echo "Patch successful."
